<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Bubuuu ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff7fb;
  color: #4b3040;
  overflow: hidden;
}

.page {
  display: none;
  height: 100vh;
  width: 100%;
  text-align: center;
  padding: 35px 25px;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  animation: fade 0.5s ease;
}

.page.active {
  display: flex;
}

@keyframes fade {
  from {
    opacity: 0;
    transform: translateX(20px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

/* PAGE 1 */

.photo {
  width: 280px;
  max-width: 85%;
  border-radius: 25px;
  box-shadow: 0 10px 30px rgba(100,50,80,0.2);
  margin-bottom: 30px;
}

h1 {
  font-size: 28px;
  margin: 5px 0 25px;
}

button {
  border: none;
  background: #d98caf;
  color: white;
  padding: 13px 28px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(150,70,100,0.2);
}
